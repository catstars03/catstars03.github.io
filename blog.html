<body id="page-top">

            <span class="d-none d-lg-block">
                <img class="img-fluid img-profile rounded-circle mx-auto mb-2" src="img/avatar.jpg" alt="">
            </span>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" 
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link js-scroll-trigger" href="index.html#about">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link js-scroll-trigger" href="index.html#interests">Interest</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link js-scroll-trigger" href="index.html#experience">Note</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link js-scroll-trigger" href="index.html#education">Article</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link js-scroll-trigger" href="index.html#skills">Blog</a>
              
                </li>
                <li class="nav-item">
                    <a class="nav-link js-scroll-trigger" href="index.html#awards">敬请期待</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Blog Detail Section -->
    <div class="container-fluid p-0">
        <section class="resume-section p-3 p-lg-5 d-flex flex-column" id="notes-detail">
            <div class="my-auto">
                <div class="back-link mb-4">
                    <a href="index.html#skills" class="text-primary">
                        <i class="fas fa-arrow-left"></i> 返回博客列表
                    </a>
                </div>
                
                <h2 class="mb-0">详细
                    <span class="text-primary">博客</span>
                </h2>
                <div class="subheading mb-5">点击博客查看详细内容</div>
                
                <!-- 标签筛选 -->
                <div class="filter-tags" id="filterTags">
                    <span class="tag active" data-category="all">全部博客</span>
                    <!-- 标签将由JavaScript动态生成 -->
                </div>
                
                <div class="container-fluid">
                    <div class="notes-container" id="notesContainer">
                        <!-- 示例卡片，用于测试显示效果 -->
                        <div class="note-card">
                            <div class="note-header">
                                <h3 class="note-title">示例博客标题</h3>
                                <div class="note-subtitle">示例博客副标题</div>
                                <div class="note-meta">2023-01-01</div>
                                <div class="toggle-icon">▼</div>
                            </div>
                            <div class="note-content">
                                <p>这是示例博客的内容部分。在GitHub Pages上应该能看到带有圆角和阴影的卡片效果。</p>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>



    <!-- Language Switcher -->
    <div class="language-switcher">
        <button id="langZh" class="btn btn-sm btn-outline-light">中文</button>
        <button id="langEn" class="btn btn-sm btn-outline-light ml-2">English</button>
    </div>

    <!-- Bootstrap core JavaScript -->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="js/resume.js"></script>
    <!-- Combined Data -->
    <script src="js/combinedData.js"></script>
    <!-- 博客渲染逻辑 -->
    <script src="js/blogtag.js"></script>
    


    <!-- Language Switcher Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentLang = getCurrentLanguage();
            const langZhBtn = document.getElementById('langZh');
            const langEnBtn = document.getElementById('langEn');
            
            // 设置当前语言按钮样式
            if (currentLang === 'zh') {
                langZhBtn.classList.add('active');
                langEnBtn.classList.remove('active');
            } else {
                langEnBtn.classList.add('active');
                langZhBtn.classList.remove('active');
            }
            
            // 添加语言切换事件
            langZhBtn.addEventListener('click', function() {
                setLanguage('zh');
            });
            
            langEnBtn.addEventListener('click', function() {
                setLanguage('en');
            });
        });
    </script>
</body>
